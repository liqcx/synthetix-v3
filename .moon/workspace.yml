$schema: "https://moonrepo.dev/schemas/workspace.json"

projects:
  globs:
    - "utils/*"
    - "protocol/*"
    - "markets/*"
    - "auxiliary/*"
    # No package.json (pure Foundry package, not a pnpm workspace member per
    # pnpm-workspace.yaml's own resolution) — the auxiliary/* glob still
    # matches the directory, so it is excluded explicitly.
    - "!auxiliary/TrustedMulticallForwarder"
    # A file, not a project root — auxiliary/* matches it too and moon warns
    # on every query. A directory-only glob (auxiliary/*/) does not suppress
    # this; only the explicit negation does.
    - "!auxiliary/README.md"
  sources:
    # Third-level packages the globs above cannot reach.
    core-subgraph: "protocol/synthetix/subgraph"
    spot-market-subgraph: "markets/spot-market/subgraph"
    perps-market-subgraph: "markets/perps-market/subgraph"

vcs:
  defaultBranch: "main"
  provider: "github"

# No `hooks:` — pre-commit and lint-staged stay as they are.
