$schema: "https://moonrepo.dev/schemas/project.json"

tags: ["ts-lib"]

tasks:
  test:
    command: "bun"
    args: ["../../.github/scripts/run-tests.ts"]
    options:
      mergeArgs: "replace"
      cache: false
  coverage:
    command: "bun"
    args:
      - "test"
      - "--coverage"
      - "--preload"
      - "./src/utils/bun/preload.ts"
      # `./` is load-bearing: bun reads a bare positional as a filter string,
      # not a path. It happens to select the same 21 files here (every one of
      # their paths contains "test"), which is exactly why the trap survives
      # review — the same spelling in `ci.yml` collected zero and exited 1.
      - "./test"
    deps: ["^:coverage"]
    options:
      mergeArgs: "replace"
      cache: false
