$schema: "https://moonrepo.dev/schemas/project.json"

tags: ["ts-lib"]

tasks:
  test:
    command: "bun"
    args: ["../../.github/scripts/run-tests.ts"]
    options:
      mergeArgs: "replace"
      cache: false
  coverage:
    command: "bun"
    args:
      - "test"
      - "--coverage"
      - "--preload"
      - "./src/utils/bun/preload.ts"
      - "test"
    deps: ["^:coverage"]
    options:
      mergeArgs: "replace"
      cache: false
