version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      cannon:
        patterns:
          - "@usecannon*"
          - "*cannon*"
      lerna:
        patterns:
          - "*lerna*"
      subgraph:
        patterns:
          - "@graphprotocol*"
          - "matchstick"
      tests:
        patterns:
          - "*prettier*"
          - "*eslint*"
          - "*solhint*"
          - "*lint*"
          - "*mocha*"
          - "*sinon*"
          - "*nyc*"
          - "*jest*"
      other:
        patterns:
          - "*"

        # excluding all patterns from other groups
        exclude-patterns:
          # cannon
          - "@usecannon*"
          - "*cannon*"

          # lerna
          - "*lerna*"

          # subgraph
          - "@graphprotocol*"
          - "matchstick"

          # tests
          - "*prettier*"
          - "*eslint*"
          - "*solhint*"
          - "*lint*"
          - "*mocha*"
          - "*sinon*"
          - "*nyc*"
          - "*jest*"
    reviewers:
      - "noisekit"
    ignore:
      # Both sit on an `npm:` alias to the @alxwlw/cannon-* fork. Dependabot
      # does not understand aliases: it reads the name `@usecannon/*`, compares
      # against upstream and proposes an "update" that overwrites the alias with
      # stock Cannon. The fork's version is moved by `cannon-update.yml` /
      # `pnpm cannon:update` instead.
      - dependency-name: "@usecannon/builder"
      - dependency-name: "@usecannon/cli"
      - dependency-name: "@openzeppelin/contracts"
      - dependency-name: "@ethersproject*"
      - dependency-name: "ethers"
      - dependency-name: "chalk"
      - dependency-name: "node-fetch"
      - dependency-name: "forge-std"
      - dependency-name: "solc"
