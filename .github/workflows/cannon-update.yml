name: cannon-update

on:
  workflow_dispatch:
    inputs:
      cannon_tag:
        description: "Cannon Tag"
        required: true
        default: nonce
        type: choice
        # Cannon comes from the @alxwlw/cannon-* fork, which publishes only
        # these two dist-tags (both on 2.26.1-nonce.1 today). Upstream's hotfix
        # and alpha tags do not exist there — picking one would 404 `pnpm add`.
        options:
          - nonce
          - latest

jobs:
  cannon-update:
    runs-on: self-hosted
    # Explicit least-privilege scopes rather than the ambient default:
    # contents+pull-requests for peter-evans/create-pull-request to push the
    # branch and open the PR.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: alxwlw/stack/.github/actions/setup@v1
        with:
          install: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm cannon:update
        env:
          CANNON_TAG: ${{ inputs.cannon_tag }}

      - uses: peter-evans/create-pull-request@v7
        with:
          title: "Cannon Update: ${{ inputs.cannon_tag }}"
          commit-message: "Cannon Update: ${{ inputs.cannon_tag }}"
          body: ""
          branch: cannon-${{ inputs.cannon_tag }}
          # No labels: neither `dependabot` nor `cannon` exists in this repo,
          # and creating them here would need `issues: write` on top of the
          # push/PR scopes above. Create them in repo settings first if you
          # want this line back.
          draft: true
          add-paths: .
