name: Nightly contracts

# 03:00 UTC. The heavy suite cannot run per-PR: the org's runner pool is
# 4 x (2 CPU, 4 GB) on the production host, shared with monorepo, dev-agent
# and infra, and one build-testable plus seven integration suites would hold
# it for hours. See docs/superpowers/specs/2026-09-04-circleci-to-gha-design.md.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "Only this package (e.g. markets/perps-market); empty runs all"
        required: false
        default: ""
        type: string
      batch_size:
        description: "Override the per-suite batch size; empty keeps the defaults"
        required: false
        default: ""
        type: string

# One nightly at a time, and never cancel one in flight — a half-finished
# build-testable leaves nothing useful behind.
concurrency:
  group: nightly-contracts
  cancel-in-progress: false

jobs:
  suites:
    runs-on: self-hosted
    # Deliberately generous: CircleCI ran perps-market eight ways in parallel,
    # we run every suite serially on 2 CPUs.
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    env:
      GT_READ: ${{ secrets.GT_READ }}
      CANNON_REGISTRY_PRIORITY: local
    steps:
      - uses: actions/checkout@v5
      - uses: liqcx/tooling/.github/actions/setup-liqcx@v1
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile

      - run: moon run :build-ts
      - run: moon run :generate-testable

      # oracle-manager's cannonfile provisions `trusted-multicall-forwarder`
      # with no version, i.e. the mutable `latest@main`. On a runner the local
      # cannon registry is empty, so that resolves through the ON-CHAIN registry
      # to a CID whose bytes live only on Cannon's own repo service — and the
      # regional hostnames it uses (`us-east.repo.usecannon.com` and friends,
      # picked by timezone in cannon-builder/src/constants.ts:54) fail the TLS
      # handshake with alert 40 for everyone, not just from here. The apex
      # `repo.usecannon.com` has a valid certificate; the second-level wildcard
      # evidently is not covered. Nor is the content reachable another way:
      # delegated routing reports zero providers for the CID and every public
      # gateway times out, so cannon packages simply are not on the public DHT.
      #
      # The source of that package is in this repo, so build it into the local
      # registry first: `latest@main` then resolves `via local` and the
      # provision never touches the network. Two things this step depends on:
      #   * NO --chain-id. cannon only spawns its own anvil when the flag is
      #     absent (cannon-cli/src/util/build.ts:127); passing it sends cannon
      #     to frame / 127.0.0.1:8545 and the build hangs on reconnect.
      #   * The version in cannonfile.toml must not exist on the on-chain
      #     registry, or the build refuses with "already published" — hence
      #     0.0.4-liq.1 rather than upstream's 0.0.4.
      # The package is a pure Foundry one (no package.json, excluded from moon
      # in .moon/workspace.yml), so this is a plain step, not a moon task.
      #
      # `forge install` first: this package's lib/ is gitignored and there are
      # no submodules (.gitmodules is empty), so a fresh checkout has neither
      # dependency and `forge build` fails on `lib/forge-std/src/Test.sol` and
      # `lib/openzeppelin-contracts/…/ERC2771Forwarder.sol`. Both are pinned by
      # tag, not floated: openzeppelin v5.0.0 is the version whose ERC2771Forwarder
      # src/TrustedMulticallForwarder.sol extends (it does not exist before 5.x),
      # and forge-std v1.9.7 is the tag the rest of the repo pins in package.json.
      # --no-git because a submodule inside this repo is not wanted; --shallow
      # because only the tagged tree is used.
      - name: Register trusted-multicall-forwarder in the local cannon registry
        working-directory: auxiliary/TrustedMulticallForwarder
        run: |
          forge install --shallow --no-git \
            OpenZeppelin/openzeppelin-contracts@v5.0.0 \
            foundry-rs/forge-std@v1.9.7
          pnpm exec cannon build cannonfile.toml --quiet

      # Same wall, different package: BuybackSnx and OwnedFeeCollector provision
      # `mintable-token:...@permissionless-mint`, whose bytes are just as
      # unreachable. Unlike the forwarder this package had no source in the repo,
      # so auxiliary/MintableToken is a vendored copy — see its README for what
      # was recovered from the upstream artifact and what had to be decided.
      # forge-std is not needed here (no Foundry tests), only OpenZeppelin, and
      # at the same v5.0.0 tag the forwarder pins.
      - name: Register mintable-token in the local cannon registry
        working-directory: auxiliary/MintableToken
        run: |
          forge install --shallow --no-git \
            OpenZeppelin/openzeppelin-contracts@v5.0.0
          pnpm exec cannon build cannonfile.toml --quiet

      # Serial on purpose. Every cannon build spawns its own anvil, and every
      # package's hardhat.config.ts (utils/common-config/hardhat.config.ts,
      # spread by every package including markets/perps-market) now honours
      # ANVIL_PORT — but nothing sets ANVIL_PORT for this build-testable step,
      # so every package here still falls back to the same default port,
      # 8545. Run two build-testable tasks at once and the second anvil dies
      # with "Address already in use (os error 98)"; the run before this one
      # lost ArbitrumGasPriceOracle, OpGasPriceOracle and PythERC7412Wrapper
      # that way while oracle-manager held the port. The alternative — a
      # distinct port per package — needs a per-task index moon does not hand
      # out, so serialise instead: 16 packages, tens of seconds each, against
      # this job's 360-minute budget.
      - run: moon run :build-testable
        env:
          MOON_CONCURRENCY: "1"

      - name: Hardhat integration suites
        env:
          SUITE_FILTER: ${{ inputs.suite }}
          BATCH_SIZE_OVERRIDE: ${{ inputs.batch_size }}
        run: .github/scripts/run-suites.sh

      # perps-market's Foundry stand reads script/Deploy.sol, which
      # build-testable has just generated.
      - name: Foundry stand (perps-market)
        if: ${{ inputs.suite == '' || inputs.suite == 'markets/perps-market' }}
        run: cd markets/perps-market && forge test

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-${{ github.run_id }}
          path: /tmp/junit
          retention-days: 7
          if-no-files-found: warn
