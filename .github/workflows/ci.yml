name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Never cancel a run on main; supersede in-flight PR runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Static gates. ~5 minutes, no compilation.
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      # The committed .npmrc routes the @liqcx scope to GitHub Packages and
      # reads its token from ${GT_READ}. setup-liqcx mirrors this into the
      # user-level ~/.npmrc — pnpm >= 11.15 ignores env credentials in a
      # committed project .npmrc.
      #
      # The org-level GT_READ secret, not GITHUB_TOKEN: this repo's own
      # GITHUB_TOKEN gets a 403 on @liqcx/tooling-canon, because the @liqcx
      # packages are published from liqcx/tooling and grant Actions access
      # per-repository. GT_READ is org-scoped and visible to every private
      # repo in the org.
      GT_READ: ${{ secrets.GT_READ }}
    steps:
      - uses: actions/checkout@v5
      - uses: liqcx/tooling/.github/actions/setup-liqcx@v1
      - run: pnpm install --frozen-lockfile

      - run: pnpm pretty
      - run: pnpm lint:js
      - run: pnpm lint:sol
      - run: pnpm dedupe --check
      - run: pnpm deps
      - run: pnpm deps:mismatched
      - run: pnpm deps:circular
      - run: pnpm exec liqcx-tooling-sync --check --type=contracts

      # .github/scripts/run-tests.test.ts is the nightly's own test runner's
      # unit suite (anvil-port claiming, process-group reaping, the mode
      # table) — no contracts build needed, so it belongs with the other
      # static gates that run on every PR, not with nightly-contracts.yml.
      #
      # bun test treats a bare positional as a filter string rather than a
      # path, so the leading `./` is load-bearing. The scope is the directory
      # and not one file, so a test added beside run-tests.test.ts is gated
      # too; __fixtures__ is excluded because leaky-child/test/leak.test.ts is
      # a fixture run-tests.test.ts spawns itself (with LEAK_PID_FILE set) to
      # prove the anvil-reap works, and when discovered bare it fails its own
      # guard on purpose rather than leaking the process it would spawn.
      - name: Test .github/scripts
        run: bun test ./.github/scripts --path-ignore-patterns='**/__fixtures__/**'

      # actionlint spawns one shellcheck child per workflow file in parallel,
      # and every proto shim invocation rewrites the same temp plugin file —
      # they collide. setup-liqcx resolves both real binaries into the env for
      # exactly this reason; invoke them directly.
      - name: Lint workflows
        run: exec "${ACTIONLINT_BIN:-actionlint}" -shellcheck "${SHELLCHECK_BIN:-shellcheck}"
      # --no-git: this repo is a fork of upstream Synthetix v3 and cannot rewrite
      # that history. Scanning the full 3000+-commit history turns up 14 leaks,
      # all in .yarn/releases bundles and removed packages/** trees from
      # 2021-2023 upstream commits — permanent, unfixable red. Scan the working
      # tree instead: that's what CI is actually gating.
      - name: Scan for secrets
        run: gitleaks detect --source=. --config=.gitleaks.toml --no-git --no-banner --redact
      - run: pnpm lint:yaml
      - run: pnpm lint:md

  # Compilation, storage layout, contract size, and the Foundry suites that
  # need no Cannon build. Everything that needs build-testable is in
  # nightly-contracts.yml.
  contracts:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: self-hosted
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      GT_READ: ${{ secrets.GT_READ }}
      # Avoid a registry reach-out on the production self-hosted runner.
      CANNON_REGISTRY_PRIORITY: local
    steps:
      - uses: actions/checkout@v5
        with:
          # storage:verify diffs against the merge base; a shallow clone has
          # no such ref.
          fetch-depth: 0
      - uses: liqcx/tooling/.github/actions/setup-liqcx@v1
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile

      - run: moon run :build-ts
      - run: moon run :storage-dump
      - run: moon run :check-storage

      # Restore the committed dumps from the merge base and diff the freshly
      # generated ones against them — this is what catches a storage-layout
      # collision on an upgrade. On a push to main the merge base is the commit
      # itself, so the comparison would be vacuous; skip it there.
      - name: Verify storage layout against the merge base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="$(git merge-base HEAD "origin/${BASE_REF}")"
          echo "Comparing against $base"
          while IFS= read -r -d '' f; do
            # A dump that does not exist at the merge base is a new package —
            # nothing to compare against, so leave the freshly generated one.
            if git cat-file -e "$base:${f#./}" 2>/dev/null; then
              git checkout "$base" -- "$f"
            else
              echo "::notice::no baseline for $f (new since $base)"
            fi
          done < <(find . -name 'storage.dump.json' -print0)
          moon run :storage-verify

      - run: moon run :size-contracts

      # The Foundry stands that build straight from source. perps-market is NOT
      # here: its stand needs script/Deploy.sol, which build-testable generates.
      # RewardsDistributor and RewardsDistributorExternal are NOT here either:
      # both fail to compile because their test/MintableToken.sol (and, for
      # RewardsDistributor, test/SnapshotRewardsDistributorUnitTest.sol) import
      # forge-std/mocks/MockERC20.sol (and MockERC721.sol). Before this plan
      # both packages floated on forge-std#master, which had drifted onto a
      # src/mocks/ that shipped in no tagged release; a prior task in this
      # plan pinned them to the same v1.9.7 tag as the rest of the repo for
      # deps:mismatched, which took the mocks away (invisible then because the
      # pnpm-linking break above made these two fail to compile earlier
      # anyway). No fix: verified against every forge-std tag through the
      # latest, v1.16.2 (github.com/foundry-rs/forge-std, checked
      # 2026-09-04) — none ship src/mocks/; only the floating #master ref
      # currently does, and that is exactly what deps:mismatched exists to
      # forbid.
      - name: Foundry suites (no Cannon)
        # Naming targets, rather than withholding the task, is what keeps
        # RewardsDistributor* (reason above) out of this step.
        #
        # The targets carry their package scripts verbatim: `forge test -vvvvv`
        # for treasury-market, `-vv` for Faucet. The step they replaced ran a
        # bare `forge test`, and -vvvvv prints full call traces for PASSING tests
        # too, so an all-green run of this step logged 13,262,150 bytes / 67,554
        # lines. FOUNDRY_VERBOSITY caps the effective level — measured on forge
        # 1.5.1, effective = min(-v flag, env) over the {0,1,2,3,5} x {no flag,
        # -vvvvv} matrix — which is a CI-only knob: it leaves the targets, the
        # suites and the counts alone (21 + 56 tests, unchanged) and puts the
        # green log at 7,703 bytes / 100 lines. 3 rather than 0 because a failing
        # test still prints its execution trace there: on a deliberately broken
        # 2-test suite, 780 bytes at 0 (no trace), 7,291 at 3 (trace), 319,261 at
        # -vvvvv.
        env:
          FOUNDRY_VERBOSITY: "3"
        run: moon run treasury-market:forge-test Faucet:test Delegate7702:test
