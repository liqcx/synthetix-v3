$schema: "https://moonrepo.dev/schemas/project.json"

tags: ["contracts"]

# Narrower than its tag: these verbs have never existed here, and a task the
# package never had would make `moon run :<verb>` touch more than `pnpm -r` does.
workspace:
  inheritedTasks:
    exclude: ["build-testable", "check-storage", "generate-testable"]

tasks:
  publish-contracts:
    script: "cannon publish synthetix-legacy-market:$(node -p 'require(`./package.json`).version') --chain-id 13370 --quiet --tags $(node -p '/^\\d+\\.\\d+\\.\\d+$/.test(require(`./package.json`).version) ? `latest` : `dev`')"
    deps: ["^:publish-contracts"]
    options:
      cache: false
